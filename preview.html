    // ================= LocalStorage 收藏自訂 Hook =================
    const STORAGE_KEY = 'gowonder_favorites_v1';
    function useFavorites() {
      const getInitial = () => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              destinations: Array.isArray(parsed.destinations) ? parsed.destinations : [],
              attractions: Array.isArray(parsed.attractions) ? parsed.attractions : []
            };
          }
        } catch (e) {}
        return { destinations: [], attractions: [] };
      };

      const [favorites, setFavorites] = useState(getInitial);

      useEffect(() => {
        const sync = () => setFavorites(getInitial());
        window.addEventListener('storage', sync);
        window.addEventListener('gowonder_sync', sync);
        return () => {
          window.removeEventListener('storage', sync);
          window.removeEventListener('gowonder_sync', sync);
        };
      }, []);

      const save = (updated) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
          setFavorites(updated);
          window.dispatchEvent(new Event('gowonder_sync'));
        } catch (e) {}
      };

      const isDestinationFavorite = (id) => favorites.destinations.includes(id);
      const isAttractionFavorite = (id) => favorites.attractions.includes(id);

      const toggleDestinationFavorite = (id) => {
        const exists = favorites.destinations.includes(id);
        const updated = {
          ...favorites,
          destinations: exists ? favorites.destinations.filter(x => x !== id) : [...favorites.destinations, id]
        };
        save(updated);
      };

      const toggleAttractionFavorite = (id) => {
        const exists = favorites.attractions.includes(id);
        const updated = {
          ...favorites,
          attractions: exists ? favorites.attractions.filter(x => x !== id) : [...favorites.attractions, id]
        };
        save(updated);
      };

      const clearAllFavorites = () => {
        save({ destinations: [], attractions: [] });
      };

      const totalCount = favorites.destinations.length + favorites.attractions.length;

      return {
        favorites,
        totalCount,
        isDestinationFavorite,
        isAttractionFavorite,
        toggleDestinationFavorite,
        toggleAttractionFavorite,
        clearAllFavorites
      };
    }

              <span className="badge badge-primary" style={{ marginBottom: '10px' }}>MY WISHLIST</span>
              <h1 className="page-banner-title">我的旅行收藏庫</h1>
              <p className="page-banner-subtitle">保存在瀏覽器 LocalStorage，重開視窗或離線檢閱也不會遺失！</p>
            </div>
          </section>

          <div className="container" style={{ paddingBottom: '80px' }}>
            {favHook.totalCount > 0 ? (
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '28px' }}>
                  <div className="favorites-tabs" style={{ margin: 0, padding: 0, border: 'none' }}>
                    <button className={"tab-btn " + (tab === 'all' ? 'active' : '')} onClick={() => setTab('all')}>全部收藏 ({favHook.totalCount})</button>
                    <button className={"tab-btn " + (tab === 'dest' ? 'active' : '')} onClick={() => setTab('dest')}>收藏城市 ({favDests.length})</button>
                    <button className={"tab-btn " + (tab === 'attr' ? 'active' : '')} onClick={() => setTab('attr')}>收藏景點 ({favAttrs.length})</button>
                  </div>
                  <button className="btn btn-secondary btn-sm" style={{ color: '#E53E3E' }} onClick={favHook.clearAllFavorites}>🗑️ 清空收藏</button>
                </div>

                {(tab === 'all' || tab === 'dest') && favDests.length > 0 && (
                  <section style={{ marginBottom: '40px' }}>
                    <h3 style={{ marginBottom: '20px' }}>📍 收藏的目的地 ({favDests.length})</h3>
                    <div className="destination-grid">
                      {favDests.map(d => (
                        <DestinationCard
                          key={d.id}
                          destination={d}
                          isFav={true}
                          onToggleFav={favHook.toggleDestinationFavorite}
                        />
                      ))}
                    </div>
                  </section>
                )}

                {(tab === 'all' || tab === 'attr') && favAttrs.length > 0 && (
                  <section>
                    <h3 style={{ marginBottom: '20px' }}>🏛️ 收藏的景點名勝 ({favAttrs.length})</h3>
                    <div className="attraction-grid">
                      {favAttrs.map(a => (
                        <AttractionCard
                          key={a.id}
                          attraction={a}
                          isFav={true}
                          onToggleFav={favHook.toggleAttractionFavorite}
                        />
                      ))}
                    </div>
                  </section>
                )}
              </div>
            ) : (
              <div className="empty-state">
                <div className="empty-icon">🤍</div>
                <h3>目前尚未有任何收藏</h3>
                <p>探索時點擊卡片右上角愛心，即可將喜愛的城市或景點保存至此！</p>
                <a href="#/explore" className="btn btn-primary">立即探索目的地 ➜</a>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SourcesCreditsPage() {
      return (
        <div>
          <section className="page-banner">
            <div className="container">
              <span className="badge badge-teal" style={{ marginBottom: '10px' }}>TRANSPARENCY</span>
              <h1 className="page-banner-title">資料來源與圖片授權聲明</h1>
              <p className="page-banner-subtitle">全站文字引自官方權威旅遊機構，圖片皆具備正式商用授權許可。</p>
            </div>
          </section>

          <div className="container" style={{ paddingBottom: '80px' }}>
            <h2 style={{ fontSize: '1.6rem', marginBottom: '16px' }}>📖 官方文字資料來源 ({sources.length})</h2>
            <div className="credits-table-wrapper" style={{ marginBottom: '48px' }}>
              <table className="credits-table">
                <thead>
                  <tr>
                    <th>資料名稱</th>
                    <th>類型</th>
                    <th>查閱日期</th>
                    <th>原始網址</th>
                  </tr>
                </thead>
                <tbody>
                  {sources.map(s => (
                    <tr key={s.id}>
                      <td><strong>{s.name}</strong><div style={{ fontSize: '0.8rem', color: '#718096' }}>{s.notes}</div></td>
                      <td><span className="badge badge-teal">{s.type}</span></td>
                      <td><code>{s.accessedAt}</code></td>
                      <td><a href={s.url} target="_blank" rel="noreferrer" style={{ color: 'var(--color-primary)', fontWeight: 600 }}>官方連結 ↗</a></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <h2 style={{ fontSize: '1.6rem', marginBottom: '16px' }}>📷 圖片版權與授權清單 ({imageCredits.length})</h2>
            <div className="credits-table-wrapper">
              <table className="credits-table">
                <thead>
                  <tr>
                    <th>預覽</th>
                    <th>名稱</th>
                    <th>攝影作者</th>
                    <th>圖庫來源</th>
                    <th>授權許可</th>
                    <th>原始連結</th>
                  </tr>
                </thead>
                <tbody>
                  {imageCredits.map(c => (
                    <tr key={c.id}>
                      <td><img referrerPolicy="no-referrer" src={c.imageUrl || c.file} alt={c.title} className="credit-thumb" /></td>
                      <td><strong>{c.title}</strong><div style={{ fontSize: '0.75rem', color: '#718096' }}>ID: {c.id}</div></td>
                      <td><span style={{ color: 'var(--color-primary)', fontWeight: 600 }}>{c.author}</span></td>
                      <td>{c.sourceType}</td>
                      <td><span className="badge badge-verified">✓ {c.usagePermission}</span></td>
                      <td><a href={c.sourceUrl} target="_blank" rel="noreferrer" style={{ color: 'var(--color-blue)', textDecoration: 'underline' }}>查看來源 ↗</a></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ================= 主應用程式 =================
    function App() {
      const [route, setRoute] = useState(window.location.hash.replace(/^#/, '') || '/');
      const favHook = useFavorites();

      useEffect(() => {
        const handleHashChange = () => {
          const r = window.location.hash.replace(/^#/, '') || '/';
          setRoute(r);
          window.scrollTo(0, 0);
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      let pageComponent = <HomePage favHook={favHook} />;

      if (route.startsWith('/explore')) {
        pageComponent = <ExplorePage favHook={favHook} />;
      } else if (route.startsWith('/destination/')) {
        const destId = route.replace('/destination/', '');
        pageComponent = <DestinationDetailPage id={destId} favHook={favHook} />;
      } else if (route.startsWith('/favorites')) {
        pageComponent = <FavoritesPage favHook={favHook} />;
      } else if (route.startsWith('/sources-credits')) {
        pageComponent = <SourcesCreditsPage />;
      }

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Navbar currentRoute={route} totalCount={favHook.totalCount} />
          <main style={{ flex: '1 0 auto' }}>
            {pageComponent}
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
